<style>

  .font-display{font-family:'Space Grotesk',sans-serif;}

  ::-webkit-scrollbar-thumb{background:#D8D4C8;border-radius:4px;}
  .receipt-dash{background-image:repeating-linear-gradient(to bottom,#D8D4C8 0,#D8D4C8 6px,transparent 6px,transparent 12px);width:1px;}

  .nav-active{background:#E6F0EA;color:#134F39;font-weight:600;}

  <div class="w-full max-w-md">

    <div class="mb-8 text-center">

<script>
/* ============ CONFIG & STATE ============ */
const MENUS = [
  {id:'dashboard', label:'Dashboard', icon:'grid', roles:['admin']},
  {id:'kasir', label:'Kasir', icon:'cart', roles:['admin','kasir']},
  {id:'pesanan', label:'Monitoring Pesanan', icon:'clock', roles:['admin','kasir']},
  {id:'produk', label:'Produk', icon:'box', roles:['admin','kasir']},
  {id:'kategori', label:'Kategori', icon:'layers', roles:['admin','kasir']},
  {id:'stokdasar', label:'Stok Dasar', icon:'archive', roles:['admin','kasir']},
  {id:'penambahanstok', label:'Tambah Stok', icon:'plus', roles:['admin','kasir']},
  {id:'member', label:'Member', icon:'users', roles:['admin','kasir']},
  {id:'diskon', label:'Diskon', icon:'tag', roles:['admin']},
  {id:'hpp', label:'HPP', icon:'calc', roles:['admin']},
  {id:'laporan', label:'Laporan', icon:'chart', roles:['admin','kasir']},
  {id:'user', label:'User', icon:'user', roles:['admin']},
];
const ICONS = {
  grid:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
  cart:'<path d="M3 4h2l2.4 11h11.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 13h4"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  calc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.8 0 5.5 1.8 6 4.5"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  chart:'<path d="M4 20V10M11 20V4M18 20v-7"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
};
function icon(name,cls){ return `<svg class="${cls||'w-5 h-5'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

const SCRIPT_URL_BAWAAN = 'https://script.google.com/macros/s/AKfycbwTB7gr8hHCIrm_7WVNzOo_cfbTefy5mhYW3SWEUGyvGLLNJPMW2Pa7SiWOGd7TAI_W/exec';
let SCRIPT_URL = localStorage.getItem('kasirku_script_url') || SCRIPT_URL_BAWAAN;
let saveTimer = null;

let db = { produk:[], kategori:[], stokDasar:[], riwayatStok:[], member:[], voucher:[], user:[], transaksi:[] };
let session = { user:null, page:'dashboard', cart:[], member:null, voucher:null, kategoriFilter:null, metodeBayar:'tunai', buktiFoto:null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rupiah(n){ return 'Rp' + Math.round(n||0).toLocaleString('id-ID'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ============ STOK EFEKTIF (mandiri vs terhubung ke stok dasar) ============ */
function stokEfektif(p){
  if(p.mode==='terhubung' && p.stokDasarId){
    const sd = db.stokDasar.find(x=>x.id===p.stokDasarId);
    if(!sd) return 0;
    return Math.floor(sd.stok / (p.isi||1));
  }
  return p.stok||0;
}
function kurangiStokProduk(p, qty){
  if(p.mode==='terhubung' && p.stokDasarId){
    const sd = db.stokDasar.find(x=>x.id===p.stokDasarId);
    if(sd) sd.stok -= (p.isi||1)*qty;
  } else {
    p.stok = (p.stok||0) - qty;
  }
}
function hppProduk(p){
  if(p.mode==='terhubung' && p.stokDasarId){
    const sd = db.stokDasar.find(x=>x.id===p.stokDasarId);
    return sd ? (sd.hpp||0)*(p.isi||1) : 0;
  }
  return p.hpp||0;
}

/* ============ SETUP / KONEKSI DATABASE (Google Apps Script Web App) ============ */

function initApp(){
  connectDatabase();
}

async function connectDatabase(){
  const errEl = document.getElementById('setup-error');
  errEl.classList.add('hidden');
  try{
    await loadFromServer();
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-screen').classList.add('flex');
  }catch(e){
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('flex');
    errEl.textContent = 'Gagal terhubung ke database: ' + e.message;
    errEl.classList.remove('hidden');
  }
}

function gantiDatabase(){
  location.reload();
}

async function loadFromServer(){
  const res = await fetch(SCRIPT_URL, {method:'GET'});
  if(!res.ok) throw new Error('Server merespons status ' + res.status);
  const text = await res.text();
  try{ db = JSON.parse(text); }catch(e){ throw new Error('URL benar tapi bukan database Kasirku yang valid.'); }
  db.produk = db.produk||[]; db.kategori = db.kategori||[]; db.stokDasar = db.stokDasar||[]; db.riwayatStok = db.riwayatStok||[];
  db.member = db.member||[]; db.voucher = db.voucher||[];
  db.user = db.user||[]; db.transaksi = db.transaksi||[];
  localStorage.setItem('kasirku_cache', JSON.stringify(db));
}

function scheduleSave(){
  const badge = document.getElementById('sync-badge');
  if(badge){ badge.textContent = 'Menyimpan...'; badge.className='text-xs font-num px-2.5 py-1 rounded-full bg-amber-light text-amber-dark'; }
  localStorage.setItem('kasirku_cache', JSON.stringify(db));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToServer, 700);
}

async function saveToServer(){
  const badge = document.getElementById('sync-badge');
  try{
    // text/plain dipakai agar browser tidak melakukan CORS preflight ke Apps Script
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(db)
    });
    if(!res.ok) throw new Error('status ' + res.status);
    if(badge){ badge.textContent = 'Tersimpan'; badge.className='text-xs font-num px-2.5 py-1 rounded-full bg-primary-light text-primary-dark'; }
  }catch(e){
    if(badge){ badge.textContent = 'Gagal simpan'; badge.className='text-xs font-num px-2.5 py-1 rounded-full bg-danger/10 text-danger'; }
  }
}

/* ============ AUTH (app-level) ============ */
function doLogin(){
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const found = db.user.find(x=>x.username===u && x.password===p);
  if(!found){
    errEl.textContent = 'Username atau password salah.';
    errEl.classList.remove('hidden');
    return;
  }
  session.user = found;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('flex');
  document.getElementById('app').classList.remove('hidden');
  buildNav();
  const firstMenu = MENUS.find(m=>m.roles.includes(session.user.role));
  goPage(firstMenu ? firstMenu.id : 'kasir');
}
function logout(){
  session.user = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-screen').classList.add('flex');
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
}

/* ============ NAV / ROUTER ============ */
function buildNav(){
  const role = session.user.role;
  const items = MENUS.filter(m=>m.roles.includes(role));
  const navHtml = items.map(m=>`
    <button onclick="goPage('${m.id}')" data-nav="${m.id}" class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-xs text-ink/70 hover:bg-paper2 transition">
      ${icon(m.icon,'w-4 h-4')} <span>${m.label}</span>
    </button>`).join('');
  document.getElementById('side-nav').innerHTML = navHtml;
  document.getElementById('drawer-nav').innerHTML = navHtml;
  document.getElementById('bottom-nav').innerHTML = items.slice(0,5).map(m=>`
    <button onclick="goPage('${m.id}')" data-nav="${m.id}" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg text-ink/60 text-[10px]">
      ${icon(m.icon,'w-5 h-5')} <span>${m.label}</span>
    </button>`).join('');
  document.getElementById('side-user-name').textContent = session.user.nama;
  document.getElementById('side-user-role').textContent = session.user.role === 'admin' ? 'Administrator' : 'Kasir';
  document.getElementById('drawer-user-name').textContent = session.user.nama;
  document.getElementById('drawer-user-role').textContent = session.user.role === 'admin' ? 'Administrator' : 'Kasir';
}
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('-translate-x-full', !open);
  document.getElementById('drawer-backdrop').classList.toggle('hidden', !open);
}
function goPage(id){
  const menu = MENUS.find(m=>m.id===id);
  if(menu && !menu.roles.includes(session.user.role)){ return; }
  session.page = id;
  toggleDrawer(false);
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.classList.toggle('nav-active', el.dataset.nav===id);
  });
  document.getElementById('page-title').textContent = (menu?menu.label:'Dashboard');
  const renderers = {dashboard:renderDashboard, kasir:renderKasir, pesanan:renderPesanan, produk:renderProduk, kategori:renderKategori, stokdasar:renderStokDasar, penambahanstok:renderPenambahanStok, member:renderMember, diskon:renderDiskon, hpp:renderHpp, laporan:renderLaporan, user:renderUser};
  (renderers[id]||renderKasir)();
}

/* ============ MODAL HELPER ============ */
function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.getElementById('modal-backdrop').classList.add('flex');
}
function closeModal(){
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-backdrop').classList.remove('flex');
}

/* ============ DASHBOARD (admin only) ============ */
let chartMingguan=null, chartBulanan=null, chartKategori=null;
function fmtTanggalPendek(d){ return d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit'}); }
function last7Days(){
  const arr=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(d); }
  return arr;
}
function last12Months(){
  const arr=[];
  for(let i=11;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); d.setDate(1); arr.push(d); }
  return arr;
}
function renderDashboard(){
  if(session.user.role!=='admin'){
    document.getElementById('main-content').innerHTML = `<div class="bg-white border border-line rounded-2xl p-8 text-center text-ink/50">Menu ini hanya dapat diakses oleh admin.</div>`;
    return;
  }
  const today = todayStr();
  const trToday = db.transaksi.filter(t=>t.tanggal.slice(0,10)===today);
  const totalHariIni = trToday.reduce((s,t)=>s+t.total,0);
  const jumlahTr = trToday.length;
  const rataRata = jumlahTr? Math.round(totalHariIni/jumlahTr) : 0;
  const stokMenipis = db.produk.filter(p=>p.stok<=5);
  const counter = {};
  db.transaksi.forEach(t=>t.items.forEach(it=>{ counter[it.nama]=(counter[it.nama]||0)+it.qty; }));
  const terlaris = Object.entries(counter).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recent = [...db.transaksi].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,6);

  document.getElementById('main-content').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      ${statCard('Penjualan Hari Ini', rupiah(totalHariIni), 'primary')}
      ${statCard('Transaksi Hari Ini', jumlahTr, 'amber')}
      ${statCard('Rata-rata / Transaksi', rupiah(rataRata), 'ink')}
      ${statCard('Stok Menipis', stokMenipis.length, 'danger')}
    </div>
    <div class="grid lg:grid-cols-3 gap-4 mb-4">
      <div class="lg:col-span-2 bg-white border border-line rounded-2xl p-5">
        <h3 class="font-display font-semibold mb-1">Tren Penjualan 7 Hari Terakhir</h3>
        <p class="text-xs text-ink/40 mb-3">Total penjualan per hari</p>
        <div style="height:220px"><canvas id="chart-mingguan"></canvas></div>
      </div>
      <div class="bg-white border border-line rounded-2xl p-5">
        <h3 class="font-display font-semibold mb-1">Penjualan per Kategori</h3>
        <p class="text-xs text-ink/40 mb-3">30 hari terakhir</p>
        <div style="height:220px"><canvas id="chart-kategori"></canvas></div>
      </div>
    </div>
    <div class="bg-white border border-line rounded-2xl p-5 mb-4">
      <h3 class="font-display font-semibold mb-1">Tren Penjualan Bulanan</h3>
      <p class="text-xs text-ink/40 mb-3">12 bulan terakhir</p>
      <div style="height:240px"><canvas id="chart-bulanan"></canvas></div>
    </div>

function renderChartMingguan(){
  const days = last7Days();
  const labels = days.map(fmtTanggalPendek);
  const data = days.map(d=>{
    const key = d.toISOString().slice(0,10);
    return db.transaksi.filter(t=>t.tanggal.slice(0,10)===key).reduce((s,t)=>s+t.total,0);
  });
  if(chartMingguan) chartMingguan.destroy();
  chartMingguan = new Chart(document.getElementById('chart-mingguan'), {
    type:'line',
    data:{ labels, datasets:[{ label:'Penjualan', data, borderColor:'#1B6B4D', backgroundColor:'#1B6B4D22', fill:true, tension:0.3, pointRadius:3 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>rupiah(v)}}} }
  });
}
function renderChartBulanan(){
  const months = last12Months();
  const labels = months.map(d=>d.toLocaleDateString('id-ID',{month:'short',year:'2-digit'}));
  const data = months.map(d=>{
    const y=d.getFullYear(), m=d.getMonth();
    return db.transaksi.filter(t=>{ const td=new Date(t.tanggal); return td.getFullYear()===y && td.getMonth()===m; }).reduce((s,t)=>s+t.total,0);
  });
  if(chartBulanan) chartBulanan.destroy();
  chartBulanan = new Chart(document.getElementById('chart-bulanan'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Penjualan', data, backgroundColor:'#D9A441' }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>rupiah(v)}}} }
  });
}
function renderChartKategori(){
  const batas = new Date(); batas.setDate(batas.getDate()-30);
  const perKategori = {};
  db.transaksi.filter(t=>new Date(t.tanggal)>=batas).forEach(t=>{
    t.items.forEach(it=>{
      const p = db.produk.find(x=>x.id===it.produkId);
      const kat = p ? (p.kategori||'Lainnya') : 'Lainnya';
      perKategori[kat] = (perKategori[kat]||0) + it.subtotal;
    });
  });
  const labels = Object.keys(perKategori);
  const data = Object.values(perKategori);
  if(chartKategori) chartKategori.destroy();
  chartKategori = new Chart(document.getElementById('chart-kategori'), {
    type:'doughnut',
    data:{ labels: labels.length?labels:['Belum ada data'], datasets:[{ data: data.length?data:[1], backgroundColor:['#1B6B4D','#D9A441','#C0483C','#134F39','#B8862F','#8A8578'] }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}} }
  });
}
function statCard(label,val,color){
  const bg = color==='primary'?'bg-primary text-white':color==='amber'?'bg-amber text-white':color==='danger'?'bg-danger text-white':'bg-white border border-line text-ink';
  return `<div class="${bg} rounded-2xl p-4"><div class="text-xs opacity-80 mb-1">${label}</div><div class="font-num text-xl font-semibold">${val}</div></div>`;

function tambahKeranjang(pid){
  const p = db.produk.find(x=>x.id===pid);
  const stok = p ? stokEfektif(p) : 0;
  if(!p || stok<=0) return;
  const existing = session.cart.find(c=>c.produkId===pid);
  if(existing){
    if(existing.qty>=stok) return;
    existing.qty++;
  } else {
    session.cart.push({produkId:p.id, nama:p.nama, harga:p.harga, qty:1});
  }
  renderCart();
}
function ubahQty(pid,delta){
  const item = session.cart.find(c=>c.produkId===pid);
  const p = db.produk.find(x=>x.id===pid);
  if(!item) return;
  item.qty += delta;
  const stok = p ? stokEfektif(p) : 999999;
  if(item.qty<=0){ session.cart = session.cart.filter(c=>c.produkId!==pid); }
  else if(item.qty>stok){ item.qty = stok; }
  renderCart();
}

  const kode = document.getElementById('voucher-kode').value.trim().toUpperCase();
  const infoEl = document.getElementById('voucher-info');
  if(!kode){ session.voucher=null; infoEl.innerHTML=''; renderSummary(); return; }
  const v = db.voucher.find(x=>x.kode.toUpperCase()===kode);
  const now = todayStr();
  if(!v){ session.voucher=null; infoEl.innerHTML='<span class="text-danger">Kode voucher tidak ditemukan.</span>'; }
  else if(!v.aktif){ session.voucher=null; infoEl.innerHTML='<span class="text-danger">Voucher sudah tidak aktif.</span>'; }
  else if(v.tanggalMulai && now<v.tanggalMulai){ session.voucher=null; infoEl.innerHTML='<span class="text-danger">Voucher belum berlaku.</span>'; }
  else if(v.tanggalBerakhir && now>v.tanggalBerakhir){ session.voucher=null; infoEl.innerHTML='<span class="text-danger">Voucher sudah berakhir.</span>'; }

}

          </label>
        `}
      </div>`;

function onBuktiFotoChange(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else{ w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      session.buktiFoto = canvas.toDataURL('image/jpeg', 0.7);
      renderMetodeBayarArea();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function hapusBuktiFoto(){
  session.buktiFoto = null;
  renderMetodeBayarArea();
}

function computeTotals(){
  const subtotal = session.cart.reduce((s,c)=>s+c.harga*c.qty,0);
  let diskon = 0;
  if(session.voucher){
    const v = session.voucher;
    if(!v.minTransaksi || subtotal>=v.minTransaksi){
      diskon = v.tipe==='persen' ? Math.round(subtotal*v.nilai/100) : v.nilai;
      if(diskon>subtotal) diskon = subtotal;
    }
  }
  const total = subtotal - diskon;
  return {subtotal, diskon, total};
}
function renderSummary(){
  const {subtotal,diskon,total} = computeTotals();
  document.getElementById('cart-summary').innerHTML = `
    <div class="flex justify-between"><span class="text-ink/60">Subtotal</span><span>${rupiah(subtotal)}</span></div>
    ${diskon>0?`<div class="flex justify-between text-amber-dark"><span>Diskon</span><span>-${rupiah(diskon)}</span></div>`:''}
    <div class="flex justify-between font-semibold text-base pt-1 border-t border-line mt-1"><span>Total</span><span>${rupiah(total)}</span></div>`;
  const el = document.getElementById('kembalian-row');
  if(!el) return;
  if(session.metodeBayar==='tunai'){
    const bayar = parseFloat(document.getElementById('bayar-input')?.value)||0;
    const kembalian = bayar - total;
    el.innerHTML = `<span class="text-ink/60">Kembalian</span><span class="${kembalian<0?'text-danger':''}">${rupiah(Math.max(kembalian,kembalian))}</span>`;
  }else{
    el.innerHTML = '';
  }
}
function bayarTransaksi(){
  if(session.cart.length===0){ alert('Keranjang masih kosong.'); return; }
  const {subtotal,diskon,total} = computeTotals();
  const metode = session.metodeBayar || 'tunai';
  let bayar, buktiFoto = null;
  if(metode==='tunai'){
    bayar = parseFloat(document.getElementById('bayar-input').value)||0;
    if(bayar<total){ alert('Jumlah bayar kurang dari total.'); return; }
  }else{
    if(!session.buktiFoto){ alert('Foto bukti pembayaran '+(metode==='transfer'?'transfer':'QRIS')+' wajib dilampirkan.'); return; }
    bayar = total;
    buktiFoto = session.buktiFoto;
  }
  for(const c of session.cart){
    const p = db.produk.find(x=>x.id===c.produkId);
    if(!p || stokEfektif(p)<c.qty){ alert('Stok tidak cukup untuk '+c.nama); return; }
  }
  session.cart.forEach(c=>{ const p = db.produk.find(x=>x.id===c.produkId); kurangiStokProduk(p, c.qty); });
  if(session.member){ session.member.poin = (session.member.poin||0) + Math.floor(total/10000); }
  const nomorAntrian = db.transaksi.filter(t=>t.tanggal.slice(0,10)===todayStr()).length + 1;
  const catatan = (document.getElementById('catatan-pesanan').value||'').trim();
  const trx = {
    id: uid(), tanggal: new Date().toISOString(), nomorAntrian, catatan,
    kasirId: session.user.id, kasirNama: session.user.nama,
    memberId: session.member?session.member.id:null, memberNama: session.member?session.member.nama:'Umum',
    items: session.cart.map(c=>({produkId:c.produkId,nama:c.nama,qty:c.qty,harga:c.harga,subtotal:c.harga*c.qty})),
    voucherKode: session.voucher?session.voucher.kode:null,
    subtotal, diskon, total, bayar, kembalian: bayar-total,
    metodeBayar: metode, buktiFoto,
    status: 'disiapkan'
  };
  db.transaksi.push(trx);
  session.cart = []; session.member = null; session.voucher = null;
  session.metodeBayar = 'tunai'; session.buktiFoto = null;
  document.getElementById('member-hp').value=''; document.getElementById('member-info').innerHTML='';
  document.getElementById('voucher-kode').value=''; document.getElementById('voucher-info').innerHTML='';
  document.getElementById('catatan-pesanan').value='';
  renderMetodeBayar();
  scheduleSave();
  renderProdukGrid(); renderCart();
  tampilkanStruk(trx.id);
}

function buildReceiptHtml(t){
  const garis = '--------------------------------';
  const items = t.items.map(i=>{
    const kiri = i.nama.length>20 ? i.nama.slice(0,20) : i.nama;
    const baris2 = `${i.qty} x ${rupiah(i.harga)}`;
    const kanan = rupiah(i.subtotal);
    return `<div>${esc(kiri)}</div><div style="display:flex;justify-content:space-between;"><span>${baris2}</span><span>${kanan}</span></div>`;
  }).join('');
  return `
    <div style="text-align:center;">
      <div style="font-weight:600;font-size:14px;">KASIRKU</div>
      <div>${t.tanggal.slice(0,10)} ${t.tanggal.slice(11,16)}</div>
      ${t.nomorAntrian?`<div>No. Antrian: ${t.nomorAntrian}</div>`:''}
      <div>Kasir: ${esc(t.kasirNama)}</div>
      <div>Member: ${esc(t.memberNama||'Umum')}</div>
    </div>
    <div>${garis}</div>
    ${items}
    <div>${garis}</div>
    <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>${rupiah(t.subtotal)}</span></div>
    ${t.diskon>0?`<div style="display:flex;justify-content:space-between;"><span>Diskon${t.voucherKode?' ('+esc(t.voucherKode)+')':''}</span><span>-${rupiah(t.diskon)}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;font-weight:600;"><span>Total</span><span>${rupiah(t.total)}</span></div>
    <div style="display:flex;justify-content:space-between;"><span>Metode</span><span>${labelMetodeBayar(t.metodeBayar)}</span></div>
    <div style="display:flex;justify-content:space-between;"><span>Bayar</span><span>${rupiah(t.bayar)}</span></div>
    <div style="display:flex;justify-content:space-between;"><span>Kembali</span><span>${rupiah(t.kembalian)}</span></div>
    ${t.catatan?`<div>${garis}</div><div>Catatan: ${esc(t.catatan)}</div>`:''}

function labelMetodeBayar(m){

function buildLabelHtml(t){
  const labels = [];
  t.items.forEach(i=>{
    for(let n=0;n<i.qty;n++){
      labels.push(`
        <div class="label">
          <div style="font-size:9px;">#${t.nomorAntrian||'-'} · ${t.tanggal.slice(11,16)}</div>
          <div style="font-weight:700;font-size:15px;margin-top:2px;line-height:1.25;">${esc(i.nama)}</div>

          <div style="font-size:9px;margin-top:3px;color:#555;">Kasir: ${esc(t.kasirNama)}</div>

  document.getElementById('btn-mode-mandiri').dataset.mode = mode;

function simpanProduk(id){
  const nama = document.getElementById('f-nama').value.trim();
  const kategori = document.getElementById('f-kategori').value;
  const harga = parseFloat(document.getElementById('f-harga').value)||0;
  const mode = document.getElementById('field-terhubung').classList.contains('hidden') ? 'mandiri' : 'terhubung';
  if(!nama){ alert('Nama produk wajib diisi.'); return; }
  let data = {nama,kategori,harga,mode};
  if(mode==='terhubung'){
    const stokDasarId = document.getElementById('f-stokdasar').value;
    const isi = parseInt(document.getElementById('f-isi').value)||1;
    if(!stokDasarId){ alert('Pilih Stok Dasar untuk produk ini.'); return; }
    data.stokDasarId = stokDasarId; data.isi = isi; data.stok = 0;
  } else {
    const stok = parseInt(document.getElementById('f-stok').value)||0;
    data.stok = stok; data.stokDasarId=''; data.isi=1;
  }
  if(id){ const p=db.produk.find(x=>x.id===id); Object.assign(p,data); }
  else{ db.produk.push(Object.assign({id:uid()},data)); }
  scheduleSave(); closeModal(); renderProdukTable();
}
function hapusProduk(id){ if(confirm('Hapus produk ini?')){ db.produk = db.produk.filter(x=>x.id!==id); scheduleSave(); renderProdukTable(); } }

function downloadTemplateExcel(){
  const ws = XLSX.utils.json_to_sheet([
    {nama:'Contoh Produk A', kategori:'Minuman', harga:5000, stok:20},
    {nama:'Contoh Produk B', kategori:'Makanan', harga:12000, stok:10}
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Produk');
  XLSX.writeFile(wb, 'template-produk-kasirku.xlsx');
}

function handleExcelUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      let ditambah = 0, diperbarui = 0, dilewati = 0;
      rows.forEach(r=>{
        const nama = String(r.nama||r.Nama||r.NAMA||'').trim();
        if(!nama){ dilewati++; return; }
        const kategori = String(r.kategori||r.Kategori||'').trim();
        const harga = parseFloat(r.harga||r.Harga||0)||0;
        const stok = parseInt(r.stok||r.Stok||0)||0;
        if(kategori && !db.kategori.includes(kategori)) db.kategori.push(kategori);
        const existing = db.produk.find(p=>p.nama.toLowerCase()===nama.toLowerCase());
        if(existing){ Object.assign(existing,{nama,kategori,harga,stok}); diperbarui++; }
        else{ db.produk.push({id:uid(),nama,kategori,harga,stok}); ditambah++; }
      });
      scheduleSave();
      renderProdukTable();
      alert(`Impor selesai.\nDitambah: ${ditambah}\nDiperbarui: ${diperbarui}\nDilewati (tanpa nama): ${dilewati}`);
    }catch(err){
      alert('Gagal membaca file Excel: ' + err.message);
    }
    evt.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

  const nama = document.getElementById('f-kategori-nama').value.trim();
  if(!nama){ alert('Nama kategori wajib diisi.'); return; }
  if(db.kategori.some(k=>k.toLowerCase()===nama.toLowerCase() && k!==namaLama)){ alert('Kategori sudah ada.'); return; }
  if(namaLama){
    const idx = db.kategori.indexOf(namaLama);
    if(idx>-1) db.kategori[idx] = nama;
    db.produk.forEach(p=>{ if(p.kategori===namaLama) p.kategori = nama; });

function hapusKategori(nama){
  const jumlah = db.produk.filter(p=>p.kategori===nama).length;
  const pesan = jumlah>0 ? `Kategori "${nama}" dipakai oleh ${jumlah} produk. Produk tersebut akan menjadi tanpa kategori. Lanjutkan hapus?` : `Hapus kategori "${nama}"?`;
  if(confirm(pesan)){
    db.kategori = db.kategori.filter(k=>k!==nama);
    db.produk.forEach(p=>{ if(p.kategori===nama) p.kategori=''; });

function simpanStokDasar(id){
  const nama = document.getElementById('f-sd-nama').value.trim();
  const satuan = document.getElementById('f-sd-satuan').value.trim()||'pcs';
  const stok = parseInt(document.getElementById('f-sd-stok').value)||0;
  if(!nama){ alert('Nama item wajib diisi.'); return; }
  if(id){ const sd=db.stokDasar.find(x=>x.id===id); Object.assign(sd,{nama,satuan,stok}); }
  else{ db.stokDasar.push({id:uid(),nama,satuan,stok,hpp:0}); }
  scheduleSave(); closeModal(); renderStokDasarTable();
}
function hapusStokDasar(id){
  const dipakai = db.produk.some(p=>p.mode==='terhubung' && p.stokDasarId===id);
  if(dipakai){ alert('Item ini masih dipakai oleh produk. Ubah produk tersebut ke mode "Stok Sendiri" atau item lain dulu sebelum menghapus.'); return; }
  if(confirm('Hapus item stok dasar ini?')){ db.stokDasar = db.stokDasar.filter(x=>x.id!==id); scheduleSave(); renderStokDasarTable(); }
}

        </div>
        <button onclick="simpanPenambahanStok()" class="w-full bg-primary text-white font-medium py-2.5 rounded-lg text-sm">Simpan Penambahan Stok</button>
      </div>`}
    </div>
    <h3 class="font-display font-semibold mb-3">Riwayat Penambahan Stok</h3>

      </tr></thead><tbody id="riwayat-stok-tbody"></tbody></table>
    </div>`;
  renderRiwayatStok();
}
function renderRiwayatStok(){
  const list = [...db.riwayatStok].sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  document.getElementById('riwayat-stok-tbody').innerHTML = list.map(r=>`
    <tr class="border-b border-line last:border-0">
      <td class="p-3 font-num text-xs">${r.tanggal.slice(0,10)} ${r.tanggal.slice(11,16)}</td>
      <td class="p-3">${esc(r.itemNama)}</td>
      <td class="p-3 font-num text-primary">+${r.jumlah}</td>
      <td class="p-3">${esc(r.userNama)}</td>
      <td class="p-3 text-xs text-ink/50">${esc(r.catatan||'-')}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="p-6 text-center text-ink/40">Belum ada riwayat penambahan stok.</td></tr>`;
}
function simpanPenambahanStok(){
  const itemId = document.getElementById('ts-item').value;
  const jumlah = parseInt(document.getElementById('ts-jumlah').value)||0;
  const catatan = document.getElementById('ts-catatan').value.trim();
  const sd = db.stokDasar.find(x=>x.id===itemId);
  if(!sd){ alert('Pilih item terlebih dahulu.'); return; }
  if(jumlah<=0){ alert('Jumlah harus lebih dari 0.'); return; }
  sd.stok += jumlah;
  db.riwayatStok.push({id:uid(), tanggal:new Date().toISOString(), itemId:sd.id, itemNama:sd.nama, jumlah, userId:session.user.id, userNama:session.user.nama, catatan});
  scheduleSave();
  renderPenambahanStok();
}

function simpanVoucher(id){
  const kode = document.getElementById('f-kode').value.trim().toUpperCase();
  const tipe = document.getElementById('f-tipe').value;
  const nilai = parseFloat(document.getElementById('f-nilai').value)||0;
  const minTransaksi = parseFloat(document.getElementById('f-min').value)||0;
  const tanggalMulai = document.getElementById('f-mulai').value;
  const tanggalBerakhir = document.getElementById('f-akhir').value;
  const aktif = document.getElementById('f-aktif').checked;
  if(!kode){ alert('Kode voucher wajib diisi.'); return; }
  if(id){ const v=db.voucher.find(x=>x.id===id); Object.assign(v,{kode,tipe,nilai,minTransaksi,tanggalMulai,tanggalBerakhir,aktif}); }
  else{ db.voucher.push({id:uid(),kode,tipe,nilai,minTransaksi,tanggalMulai,tanggalBerakhir,aktif}); }
  scheduleSave(); closeModal(); renderVoucherTable();
}
function toggleVoucher(id){ const v=db.voucher.find(x=>x.id===id); v.aktif=!v.aktif; scheduleSave(); renderVoucherTable(); }

  document.getElementById('main-content').innerHTML = `
    <div class="flex flex-wrap gap-2 mb-4 items-end">
      <div><label class="text-xs text-ink/60">Dari</label><input id="lap-dari" type="date" onchange="renderLaporanTable()" class="block mt-1 px-3 py-2 border border-line rounded-lg text-sm bg-white"></div>
      <div><label class="text-xs text-ink/60">Sampai</label><input id="lap-sampai" type="date" onchange="renderLaporanTable()" class="block mt-1 px-3 py-2 border border-line rounded-lg text-sm bg-white"></div>
      <div><label class="text-xs text-ink/60">Kasir</label><select id="lap-kasir" onchange="renderLaporanTable()" class="block mt-1 px-3 py-2 border border-line rounded-lg text-sm bg-white">${kasirOptions}</select></div>
    </div>
    <div class="bg-white border border-line rounded-2xl overflow-x-auto">
      <table class="w-full text-sm"><thead><tr class="text-left text-ink/50 border-b border-line">
        <th class="p-3">Tanggal</th><th class="p-3">Kasir</th><th class="p-3">Member</th><th class="p-3">Item</th><th class="p-3">Voucher</th><th class="p-3">Diskon</th><th class="p-3">Total</th><th class="p-3">Metode</th><th class="p-3"></th>
      </tr></thead><tbody id="laporan-tbody"></tbody></table>
    </div>
    <div id="laporan-total" class="text-right font-num text-sm mt-3 font-semibold"></div>`;
  renderLaporanTable();
}
function renderLaporanTable(){
  const dari = document.getElementById('lap-dari').value;
  const sampai = document.getElementById('lap-sampai').value;
  const kasir = document.getElementById('lap-kasir').value;
  let list = [...db.transaksi].sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  if(dari) list = list.filter(t=>t.tanggal.slice(0,10)>=dari);
  if(sampai) list = list.filter(t=>t.tanggal.slice(0,10)<=sampai);
  if(kasir) list = list.filter(t=>t.kasirNama===kasir);
  document.getElementById('laporan-tbody').innerHTML = list.map(t=>`
    <tr class="border-b border-line last:border-0">
      <td class="p-3 font-num text-xs">${t.tanggal.slice(0,10)} ${t.tanggal.slice(11,16)}</td>
      <td class="p-3">${esc(t.kasirNama)}</td>
      <td class="p-3">${esc(t.memberNama||'Umum')}</td>
      <td class="p-3 text-xs text-ink/60">${t.items.map(i=>esc(i.nama)+' x'+i.qty).join(', ')}</td>
      <td class="p-3 font-num text-xs">${t.voucherKode?esc(t.voucherKode):'-'}</td>
      <td class="p-3 font-num">${rupiah(t.diskon||0)}</td>
      <td class="p-3 font-num font-medium">${rupiah(t.total)}</td>
      <td class="p-3"><span class="text-xs px-2 py-0.5 rounded-full ${t.metodeBayar==='tunai'||!t.metodeBayar?'bg-primary-light text-primary-dark':'bg-amber-light text-amber-dark'}">${labelMetodeBayar(t.metodeBayar)}</span>${t.buktiFoto?`<button onclick="lihatBuktiFoto('${t.id}')" class="block text-primary text-[11px] mt-1">Lihat Bukti</button>`:''}</td>
      <td class="p-3 text-right"><button onclick="tampilkanStruk('${t.id}')" class="text-primary text-xs">Cetak</button></td>
    </tr>`).join('') || `<tr><td colspan="9" class="p-6 text-center text-ink/40">Tidak ada transaksi pada rentang ini.</td></tr>`;
  document.getElementById('laporan-total').textContent = 'Total: ' + rupiah(list.reduce((s,t)=>s+t.total,0)) + ' (' + list.length + ' transaksi)';
}

/* ============ USER ============ */
function renderUser(){
  if(session.user.role!=='admin'){
    document.getElementById('main-content').innerHTML = `<div class="bg-white border border-line rounded-2xl p-8 text-center text-ink/50">Menu ini hanya dapat diakses oleh admin.</div>`;
    return;
  }
  document.getElementById('main-content').innerHTML = `
    <div class="flex justify-end mb-4"><button onclick="formUser()" class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg">+ Tambah User</button></div>
    <div class="bg-white border border-line rounded-2xl overflow-x-auto">
      <table class="w-full text-sm"><thead><tr class="text-left text-ink/50 border-b border-line">
        <th class="p-3">Nama</th><th class="p-3">Username</th><th class="p-3">Role</th><th class="p-3"></th>
      </tr></thead><tbody id="user-tbody"></tbody></table>
    </div>`;
  renderUserTable();
}
function renderUserTable(){
  document.getElementById('user-tbody').innerHTML = db.user.map(u=>`
    <tr class="border-b border-line last:border-0">
      <td class="p-3 font-medium">${esc(u.nama)}</td><td class="p-3 font-num">${esc(u.username)}</td>
      <td class="p-3"><span class="text-xs px-2 py-0.5 rounded-full ${u.role==='admin'?'bg-amber-light text-amber-dark':'bg-primary-light text-primary-dark'}">${u.role==='admin'?'Admin':'Kasir'}</span></td>
      <td class="p-3 text-right whitespace-nowrap"><button onclick="formUser('${u.id}')" class="text-primary text-xs mr-3">Edit</button><button onclick="hapusUser('${u.id}')" class="text-danger text-xs">Hapus</button></td>
    </tr>`).join('') || `<tr><td colspan="4" class="p-6 text-center text-ink/40">Belum ada user.</td></tr>`;
}
function formUser(id){
  const u = id? db.user.find(x=>x.id===id) : {nama:'',username:'',password:'',role:'kasir'};
  openModal(`
    <h3 class="font-display font-semibold text-lg mb-4">${id?'Edit':'Tambah'} User</h3>
    <div class="space-y-3">
      <div><label class="text-xs text-ink/60">Nama Lengkap</label><input id="f-nama" value="${esc(u.nama)}" class="w-full mt-1 px-3 py-2 border border-line rounded-lg text-sm"></div>
      <div><label class="text-xs text-ink/60">Username</label><input id="f-username" value="${esc(u.username)}" class="w-full mt-1 px-3 py-2 border border-line rounded-lg text-sm"></div>
      <div><label class="text-xs text-ink/60">Password ${id?'(kosongkan jika tidak diubah)':''}</label><input id="f-password" type="text" class="w-full mt-1 px-3 py-2 border border-line rounded-lg text-sm"></div>
      <div><label class="text-xs text-ink/60">Role</label>
        <select id="f-role" class="w-full mt-1 px-3 py-2 border border-line rounded-lg text-sm">
          <option value="kasir" ${u.role==='kasir'?'selected':''}>Kasir</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
        </select>
      </div>
    </div>
    <div class="flex gap-2 mt-5"><button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line text-sm">Batal</button>
    <button onclick="simpanUser('${id||''}')" class="flex-1 py-2.5 rounded-lg bg-primary text-white text-sm font-medium">Simpan</button></div>`);
}
function simpanUser(id){
  const nama = document.getElementById('f-nama').value.trim();
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  const role = document.getElementById('f-role').value;
  if(!nama||!username){ alert('Nama dan username wajib diisi.'); return; }
  if(!id && !password){ alert('Password wajib diisi untuk user baru.'); return; }
  if(db.user.some(x=>x.username===username && x.id!==id)){ alert('Username sudah digunakan.'); return; }
  if(id){ const u=db.user.find(x=>x.id===id); Object.assign(u,{nama,username,role}); if(password) u.password=password; }
  else{ db.user.push({id:uid(),nama,username,password,role}); }
  scheduleSave(); closeModal(); renderUserTable();
}
function hapusUser(id){
  if(id===session.user.id){ alert('Tidak bisa menghapus akun yang sedang digunakan.'); return; }
  if(confirm('Hapus user ini?')){ db.user=db.user.filter(x=>x.id!==id); scheduleSave(); renderUserTable(); }
}

/* ============ INIT ============ */
window.addEventListener('DOMContentLoaded', ()=>{
  initApp();
});
</script>
</body>
</html>
